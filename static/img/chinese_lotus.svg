<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 - 暖米色 -->
  <rect width="240" height="240" fill="#FFFBF5" rx="12"/>

  <!-- 水面波纹 -->
  <ellipse cx="120" cy="210" rx="100" ry="15" fill="#F97316" opacity="0.15"/>
  <ellipse cx="120" cy="210" rx="80" ry="12" fill="#FB923C" opacity="0.1"/>
  <ellipse cx="80" cy="205" rx="30" ry="5" fill="#FDBA74" opacity="0.1"/>
  <ellipse cx="160" cy="208" rx="35" ry="6" fill="#FDBA74" opacity="0.1"/>

  <!-- 荷叶 - 橙褐色调 -->
  <ellipse cx="50" cy="180" rx="40" ry="30" fill="#D97706" transform="rotate(-10 50 180)"/>
  <line x1="50" y1="180" x2="50" y2="240" stroke="#8B5A2B" stroke-width="3"/>
  <circle cx="50" cy="180" r="5" fill="#A0522D"/>

  <ellipse cx="190" cy="175" rx="35" ry="28" fill="#D97706" transform="rotate(15 190 175)"/>
  <line x1="190" y1="175" x2="190" y2="240" stroke="#8B5A2B" stroke-width="3"/>
  <circle cx="190" cy="175" r="4" fill="#A0522D"/>

  <!-- 莲花茎 -->
  <line x1="120" y1="130" x2="120" y2="240" stroke="#8B5A2B" stroke-width="4"/>

  <!-- 莲花花瓣 - 外层 - 橙色系 -->
  <ellipse cx="120" cy="130" rx="35" ry="50" fill="#FDBA74" transform="rotate(0 120 130)"/>
  <ellipse cx="120" cy="130" rx="35" ry="50" fill="#F97316" transform="rotate(36 120 130)"/>
  <ellipse cx="120" cy="130" rx="35" ry="50" fill="#FDBA74" transform="rotate(72 120 130)"/>
  <ellipse cx="120" cy="130" rx="35" ry="50" fill="#FB923C" transform="rotate(108 120 130)"/>
  <ellipse cx="120" cy="130" rx="35" ry="50" fill="#FDBA74" transform="rotate(144 120 130)"/>
  <ellipse cx="120" cy="130" rx="35" ry="50" fill="#F97316" transform="rotate(180 120 130)"/>
  <ellipse cx="120" cy="130" rx="35" ry="50" fill="#FDBA74" transform="rotate(216 120 130)"/>
  <ellipse cx="120" cy="130" rx="35" ry="50" fill="#FB923C" transform="rotate(252 120 130)"/>
  <ellipse cx="120" cy="130" rx="35" ry="50" fill="#FDBA74" transform="rotate(288 120 130)"/>
  <ellipse cx="120" cy="130" rx="35" ry="50" fill="#F97316" transform="rotate(324 120 130)"/>

  <!-- 莲花花瓣 - 中层 - 浅橙色 -->
  <ellipse cx="120" cy="130" rx="25" ry="38" fill="#FED7AA" transform="rotate(18 120 130)"/>
  <ellipse cx="120" cy="130" rx="25" ry="38" fill="#FFEDD5" transform="rotate(72 120 130)"/>
  <ellipse cx="120" cy="130" rx="25" ry="38" fill="#FED7AA" transform="rotate(126 120 130)"/>
  <ellipse cx="120" cy="130" rx="25" ry="38" fill="#FFEDD5" transform="rotate(180 120 130)"/>
  <ellipse cx="120" cy="130" rx="25" ry="38" fill="#FED7AA" transform="rotate(234 120 130)"/>
  <ellipse cx="120" cy="130" rx="25" ry="38" fill="#FFFFF5" transform="rotate(288 120 130)"/>
  <ellipse cx="120" cy="130" rx="25" ry="38" fill="#FED7AA" transform="rotate(342 120 130)"/>

  <!-- 莲花花瓣 - 内层 - 最浅 -->
  <ellipse cx="120" cy="130" rx="15" ry="25" fill="#FFFFF5" transform="rotate(0 120 130)"/>
  <ellipse cx="120" cy="130" rx="15" ry="25" fill="#FFFFF5" transform="rotate(60 120 130)"/>
  <ellipse cx="120" cy="130" rx="15" ry="25" fill="#FFFFF5" transform="rotate(120 120 130)"/>
  <ellipse cx="120" cy="130" rx="15" ry="25" fill="#FFFFF5" transform="rotate(180 120 130)"/>
  <ellipse cx="120" cy="130" rx="15" ry="25" fill="#FFFFF5" transform="rotate(240 120 130)"/>
  <ellipse cx="120" cy="130" rx="15" ry="25" fill="#FFFFF5" transform="rotate(300 120 130)"/>

  <!-- 花蕊 - 金色 -->
  <circle cx="120" cy="120" r="12" fill="#EA580C"/>
  <circle cx="120" cy="120" r="8" fill="#FB923C"/>

  <!-- 荷苞 - 橙色 -->
  <g transform="translate(20, 20) rotate(-30)">
    <line x1="15" y1="20" x2="15" y2="100" stroke="#8B5A2B" stroke-width="2"/>
    <ellipse cx="15" cy="20" rx="8" ry="15" fill="#FB923C"/>
    <ellipse cx="15" cy="20" rx="6" ry="12" fill="#FED7AA" transform="rotate(30 15 20)"/>
    <ellipse cx="15" cy="20" rx="6" ry="12" fill="#FED7AA" transform="rotate(-30 15 20)"/>
  </g>
</svg>