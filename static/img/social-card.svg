<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF6F0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FAF6F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B64F24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E07A3C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- 装饰元素 - 圆角块 -->
  <rect x="80" y="80" width="120" height="120" rx="20" fill="#F4E3D8" opacity="0.6" />
  <rect x="1000" y="450" width="140" height="100" rx="16" fill="#E07A3C" opacity="0.2" />
  <circle cx="1100" cy="120" r="50" fill="#B64F24" opacity="0.15" />
  <circle cx="100" cy="500" r="40" fill="#E07A3C" opacity="0.2" />

  <!-- 装饰元素 - 线条 -->
  <line x1="60" y1="220" x2="60" y2="410" stroke="#B64F24" stroke-width="2" opacity="0.15" />
  <line x1="1140" y1="220" x2="1140" y2="410" stroke="#B64F24" stroke-width="2" opacity="0.15" />

  <!-- 主要内容区域 -->
  <g transform="translate(100, 100)">
    <!-- 强调条 -->
    <rect x="0" y="0" width="8" height="180" fill="url(#accentGradient)" rx="4" />

    <!-- 标题 -->
    <text x="40" y="70" font-family="'Noto Sans CJK SC','Microsoft YaHei','SimHei','PingFang SC','-apple-system','BlinkMacSystemFont','Segoe UI',sans-serif" font-size="72" font-weight="700" fill="#2D2319">
      冯才文
    </text>

    <!-- 副标题 / 标语 -->
    <text x="40" y="125" font-family="'Noto Sans CJK SC','Microsoft YaHei','SimHei','PingFang SC','-apple-system','BlinkMacSystemFont','Segoe UI',sans-serif" font-size="32" font-weight="400" fill="#4A3C30">
      记录大模型、云原生与开发工具实践
    </text>

    <text x="40" y="170" font-family="'Noto Sans CJK SC','Microsoft YaHei','SimHei','PingFang SC','-apple-system','BlinkMacSystemFont','Segoe UI',sans-serif" font-size="28" font-weight="400" fill="#5C4D40">
      也收藏阅读与思考
    </text>
  </g>

  <!-- 底部强调线 -->
  <rect x="100" y="520" width="1000" height="4" fill="#B64F24" rx="2" opacity="0.7" />

  <!-- 装饰性角落元素 - 简化的几何形状 -->
  <g transform="translate(1000, 90)">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="#F4E3D8" opacity="0.5" />
    <rect x="20" y="20" width="80" height="80" rx="12" fill="#E07A3C" opacity="0.25" />
    <rect x="40" y="40" width="40" height="40" rx="6" fill="#B64F24" opacity="0.3" />
  </g>

  <!-- 站点 URL -->
  <text x="1100" y="590" font-family="'Noto Sans CJK SC','Microsoft YaHei','SimHei','system-ui','-apple-system',sans-serif" font-size="18" font-weight="400" fill="#5C4D40" text-anchor="end">
    wencaiwulue.github.io
  </text>
</svg>
